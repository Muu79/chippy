[package]
name = "chippy8_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chippy8"
path = "src/main.rs"

[dependencies]
chippy8 = { path = "../core", default-features = false }
crossterm = { version = "0.29.0", default-features = false }
ratatui = { version = "0.30.2", features = ["crossterm_0_29"], default-features = false }
rodio = {version = "0.22", default-features = false, features = ["playback"]}
